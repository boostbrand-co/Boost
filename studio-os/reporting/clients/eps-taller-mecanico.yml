client:
  id: eps-taller-mecanico
  name: EPS Taller Mecánico
  display_name: EPS Taller Mecánico
  report_language: es-MX
  currency: MXN

reporting:
  cadence: monthly
  primary_report_type: content-plus-paid-social
  comparison_default: previous_comparable_month
  delivery_state: boost-review-before-client
  core_deck_target: 8-10
  appendix_allowed: true
  client_comprehension_level: smart_business_owner_non_marketer

business_context:
  primary_objective: Maintain useful social presence through Reel ideas / editing and evaluate paid-media performance at the depth supported by the actual campaign objective and available downstream data.
  reporting_implication: Do not assume revenue, appointments or lead quality are the primary success metric until the active Ads Manager objective and available business data confirm it.

service_scope:
  organic_content:
    role: ideas_and_reel_editing
    depth: medium
    purpose: visibility_content_performance
  paid_media:
    role: active_service
    depth: medium_to_deep_if_ads_manager_available
    owner: Mau / BOOST
    reporting_rule: Match analysis to the actual campaign objective. If Ads Manager access is unavailable, do not invent paid results; complete the organic-content report and flag the missing paid source internally.

platforms:
  meta_business_suite:
    active: true
    role: primary_source_for_managed_social
  instagram:
    active: verify_in_meta
    reporting_depth: medium
  facebook:
    active: verify_in_meta
    reporting_depth: medium
  meta_ads_manager:
    active: verify_in_chrome
    reporting_depth: medium_to_deep

source_priority:
  - Meta Business Suite native data / export
  - Meta Ads Manager native data / export when accessible
  - prior monthly reports for continuity when available
  - screenshots for content / ad creative evidence and source verification

priority_kpis:
  - metric: primary_campaign_result
    channel: paid_media
    directionality: depends_on_campaign_objective
    priority: primary_if_paid_source_available
  - metric: cost_per_primary_result
    channel: paid_media
    directionality: lower_is_better
    priority: primary_if_paid_source_available
  - metric: spend
    channel: paid_media
    directionality: contextual
    priority: secondary
  - metric: reach_or_impressions
    channel: organic_social
    directionality: higher_is_better
    priority: primary
  - metric: content_views
    channel: organic_social
    directionality: higher_is_better
    priority: primary
  - metric: interactions
    channel: organic_social
    directionality: contextual
    priority: secondary
  - metric: profile_or_page_actions
    channel: organic_social
    directionality: higher_is_better
    priority: secondary
  - metric: follower_growth
    channel: organic_social
    directionality: contextual
    priority: diagnostic

paid_media_analysis:
  rule: First identify the actual campaign objective(s) before choosing report KPIs.
  if_messaging_or_lead_campaigns:
    emphasize:
      - conversations_or_leads
      - cost_per_result
      - volume_vs_previous_comparable_period
      - creative_concentration_or_fatigue_only_when_decision_relevant
  if_awareness_or_engagement_campaigns:
    emphasize:
      - reach_or_impressions
      - cost_efficiency_relevant_to_objective
      - frequency_when_decision_relevant
      - engagement_or_video_behavior_when_relevant
  never_do:
    - infer_revenue_from_messages
    - call_leads_qualified_without_downstream_data
    - recommend_scaling_only_from_low_cost_per_result
    - overload_client_with_campaign_taxonomy

content_analysis:
  priority: high
  include_real_thumbnails: true
  mandatory_visual_evidence: true
  analyze:
    - reel_topic
    - hook
    - editing_style
    - visual_structure
    - reach_or_views
    - interactions
    - relationship_between_organic_creative_and_paid_amplification_when_traceable
    - repeatable_winners_vs_outliers
  reporting_rule: Because BOOST contributes ideas and Reel editing, the report should show tangible creative evidence and explain what to repeat / adjust.

client_language:
  principle: business_meaning_first
  tone: confident_positive_truthful_practical
  avoid:
    - unnecessary_meta_ads_jargon
    - unsupported_sales_claims
    - unsupported_lead_quality_claims
    - generic_algorithm_language
  strategic_labels:
    - "LECTURA BOOST"
    - "DECISIÓN"
    - "FOCOS DEL SIGUIENTE PERIODO"

visual_skin:
  palette_mode: verified_client_colors_plus_black_white
  client_primary_accent: use_verified_brand_color_if_available
  client_secondary_accent: use_verified_brand_color_if_available
  fallback_if_unverified: black_white_neutral_do_not_invent
  boost_cosign: true
  boost_orange_usage: signature_only
  include_real_content: true
  include_real_ad_creatives: true_when_available
  cover:
    template: boost_standard_report_cover
    image_usage: optional_only_if_high_quality_and_correctly_fitted
    image_fit_rule: preserve_aspect_ratio_crop_never_stretch

monthly_memory:
  enabled: true
  fields:
    - hypotheses
    - tests_launched
    - decisions
    - recurring_reel_winners
    - recurring_underperformers
    - paid_creative_patterns
    - campaign_objectives
    - cost_per_result_benchmarks
    - measurement_gaps
    - unresolved_questions

human_review:
  required: true
  reviewer: Ana Pau / BOOST
  do_not_auto_send_to_client: true
